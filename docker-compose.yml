# Run everything with:  docker compose up --build
# First copy .env.example to .env (in this folder) and fill in the values.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mental_health_db
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mental_health_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host. Uncomment to connect with psql/pgAdmin from your machine:
    # ports:
    #   - "5433:5432"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy   # wait until PostgreSQL accepts connections
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@db:5432/mental_health_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ characters) in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      CAMPUS_COUNSELLOR_CONTACT: ${CAMPUS_COUNSELLOR_CONTACT:-Campus Counselling Centre}
      NLP_ENABLED: ${NLP_ENABLED:-true}
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface   # AI models downloaded once

  # frontend:
  #   build: ./frontend
  #   depends_on:
  #     - backend
  #   ports:
  #     - "5173:80"
  #   # The React app calls the API at http://localhost:8000/api

volumes:
  pgdata:
  hf_cache:
