# Serves the built React app. Any URL that is not a real file (e.g. /app/checkin) returns index.html,
# so React Router can handle it (this is the "SPA fallback"); refreshing a deep link then works.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Basic hardening headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Built files have a hash in their name, so they can be cached for a long time
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html must never be cached, or users would keep an old version after a deploy
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
